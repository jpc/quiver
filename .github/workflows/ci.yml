name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: deps
        run: python -m pip install -U pip polars numpy zstandard blake3 pytest pyarrow pynacl
      - name: build bvm
        # static zstd/libsodium/liburing/BLAKE3 from pinned sources (same as the wheel build)
        run: |
          quiver/exec/build-deps.sh
          make -C quiver/exec bvm
      - name: pytest
        run: PYTHONPATH=. python -m pytest tests/ -q
